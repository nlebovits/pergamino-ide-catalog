name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned to the versions this catalog was validated against. The template
      # ships these unpinned on purpose, so that a template does not hand every
      # repo made from it a stale pin. This catalog is real, so it pins here.
      - name: Install the validators
        run: python -m pip install 'rashid==0.4.0' stac-check

      - name: Lint the tooling
        run: |
          python -m pip install pyflakes
          pyflakes tools/*.py tests/*.py tools/generate/*.py

      # CI_LIGHT exempts the data files from the link check. They are gitignored
      # by design and live in object storage, so a fresh clone has the metadata
      # without the bytes. Structural links and every non-data asset are still
      # checked. Run tests/run_all.py locally, where the data is present, to
      # check those hrefs too.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py
