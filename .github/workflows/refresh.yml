name: Refresh

# Re-extract the collections whose GeoNode dataset changed, and publish each
# change as a new version. The outgoing version is archived under versions/.
# See docs/refresh.md.
#
# The probe is cheap: one GeoNode API request and one WFS hits request per
# collection. A collection is extracted only when GeoNode's last_updated or
# the row count moved, and its min_days (tools/sources.json) have passed.
# Most runs extract nothing.

on:
  schedule:
    # Mondays at 07:00 UTC, 04:00 in Pergamino.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated collection ids (empty = all)"
        required: false
        default: ""
      force:
        description: "Ignore min_days and the source signals"
        type: boolean
        default: false
      dry_run:
        description: "Print what is due and stop"
        type: boolean
        default: false

permissions:
  contents: read

# One writer at a time. A second run would archive the same current file
# and write the same version label.
concurrency:
  group: catalog-write
  cancel-in-progress: false

env:
  # chiitiler renders thumbnails. Pinned to a commit, as it has no release.
  CHIITILER_COMMIT: cad89c68ad9e5f1848eab06bb20f10394cdc2c32

jobs:
  refresh:
    # Only main publishes. The commit job pushes to main, and a run from
    # another branch would carry that branch's commits with it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The Source Cooperative service account trusts this environment, not a
    # branch. A pull request job never runs in it, so it never gets write
    # credentials.
    environment: source-coop
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      failed: ${{ steps.refresh.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # chiitiler imports node:sqlite, which needs Node 24.12 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0"

      - name: Install the refresh tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tippecanoe imagemagick
          python -m pip install -r tools/requirements.txt
          # rashid 0.4.0 conflicts with portolan-cli's pin; see
          # tools/requirements.txt.
          pipx install 'rashid==0.4.0'

      # A collection that fails is rolled back and reported. The others still
      # publish, and the job fails at the end.
      - name: Refresh what is due
        id: refresh
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--report refresh-report.json --changed changed.txt)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          set +e
          python tools/refresh.py "${args[@]}"
          code=$?
          set -e
          echo "failed=$([ $code -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -f refresh-report.json ] || { echo "refresh.py wrote no report"; exit 1; }
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("refresh-report.json"))
          print("| Collection | Outcome | Detail |\n|---|---|---|")
          for name, r in sorted(report.items()):
              lines = r["detail"].strip().splitlines() or [""]
              first = lines[-1] if r["status"] == "error" else lines[0]
              print(f"| {name} | {r['status']} | {first.replace('|', '/')} |")
          EOF

      # A thumbnail that fails the blank-render gate keeps the image of the
      # previous version, and the run says so. Thumbnails of new layers get a
      # visual review when the layer is added (docs/refresh.md).
      - name: Render thumbnails of the new versions
        if: hashFiles('changed.txt') != ''
        run: |
          [ -s changed.txt ] || exit 0
          git clone -q https://github.com/Kanahiro/chiitiler /tmp/chiitiler
          git -C /tmp/chiitiler checkout -q "$CHIITILER_COMMIT"
          (cd /tmp/chiitiler && npm ci --silent)
          (cd /tmp/chiitiler && CHIITILER_PROCESSES=0 nohup npx tsx \
            src/main.ts tile-server --port 13579 --cache memory \
            > /tmp/chiitiler.log 2>&1 < /dev/null &)
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:13579/health && break
            sleep 1
          done
          while read -r id; do
            result=$(WORK=/tmp/thumbs bash tools/generate/thumbs/render.sh "catalog/$id")
            echo "$result"
            case "$result" in
              *FAIL*) thumb="catalog/$id/$(basename "$id").thumb.jpg"
                      git checkout -- "$thumb" 2>/dev/null || rm -f "$thumb"
                      echo "::warning::$id: thumbnail kept from the previous version ($result)" ;;
            esac
          done < changed.txt
          python tools/refresh.py --restamp "$(paste -sd, changed.txt)"

      - name: Look for changes
        id: changes
        run: |
          paths=(catalog state tools/generate/data)
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- "${paths[@]}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to publish"
          fi

      # The same gates CI runs, on the refreshed metadata, before any upload.
      # The data of the unchanged collections is not in this checkout, so the
      # documented queries run after the upload instead.
      - name: Catalog gates
        if: steps.changes.outputs.changed == 'true'
        env:
          CI_LIGHT: "1"
          QUERY_CHECK_REMOTE: "0"
        run: python tests/run_all.py

      # Credentials are requested here, after the extract, so the one-hour
      # token covers only the upload.
      - name: Sign in to Source Cooperative
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.SOURCE_SA_ID }}:role/FullAccess
          audience: https://data.source.coop
          sts-endpoint: https://data.source.coop/.sts
          aws-region: us-west-2

      # publish.py uploads archives first, then data, then metadata.
      - name: Publish
        if: steps.changes.outputs.changed == 'true'
        env:
          AWS_ENDPOINT_URL_S3: https://data.source.coop
          PUBLISH_WRITE_PREFIX: s3://nlebovits/pergamino-ide
        run: python tools/publish.py --confirm

      # Every documented query against what is now public.
      - name: Check the published catalog
        if: steps.changes.outputs.changed == 'true'
        run: python tests/test_queries.py

      - name: Keep the published metadata for the commit job
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refreshed-metadata
          path: |
            catalog/
            state/
            tools/generate/data/
            !catalog/**/*.parquet
            !catalog/**/*.pmtiles
            !catalog/**/*.tif
          retention-days: 7

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-report
          path: refresh-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail when a collection failed
        if: steps.refresh.outputs.failed == 'true'
        run: |
          echo "::error::one or more collections failed; see refresh-report.json"
          exit 1

  # Git is the record of every version. This job holds the only write token
  # for the repository, and no cloud credentials.
  commit:
    needs: refresh
    if: always() && needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refreshed-metadata
          path: refreshed

      - name: Commit the published metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          rsync -a refreshed/catalog/ catalog/
          if [ -d refreshed/state ]; then rsync -a refreshed/state/ state/; fi
          rsync -a refreshed/tools/generate/data/ tools/generate/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog state tools/generate/data
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Refresh catalog versions" \
            -m "The scheduled refresh published these versions. See the workflow run for the report."
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main

  # A failed collection opens one issue, or comments on the open one. A new
  # or removed GeoNode dataset is reported the same way, as a notice.
  report:
    needs: refresh
    if: always() && needs.refresh.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refresh-report

      - name: Open or update the refresh issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF' > body.md
          import json, os
          report = json.load(open("refresh-report.json"))
          bad = {n: r for n, r in report.items()
                 if r["status"] in ("style", "error", "notice")}
          if not bad:
              raise SystemExit(0)
          print(f"The scheduled refresh needs attention. Run: {os.environ['RUN_URL']}\n")
          print("A failed collection was rolled back. It publishes nothing until the cause is fixed. "
                "A notice changes nothing by itself.\n")
          for name, r in sorted(bad.items()):
              print(f"## {name} ({r['status']})\n\n```\n{r['detail'].strip()[-3000:]}\n```\n")
          EOF
          [ -s body.md ] || { echo "nothing to report"; exit 0; }
          title="Scheduled refresh needs attention"
          number=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
